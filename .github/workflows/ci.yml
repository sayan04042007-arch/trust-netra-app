name: TrustNetra AI — CI Test Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 🛡️ Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🧪 Run TrustNetra Test Suite
        run: node tests/trustnetra.test.js

      - name: 📊 Upload Test Results
        if: always()
        run: echo "Test run complete — see output above"
